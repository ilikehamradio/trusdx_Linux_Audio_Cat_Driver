# Build an x86_64 AppImage with Gear Lever–compatible gh-releases-zsync update info.
#
# Triggers:
#   - push to master → update the rolling "continuous" release (auto on code changes)
#   - push of version tags (v1.2.3) → stable GitHub Release (channel: latest)
#   - workflow_dispatch → continuous release (or tagged if you push a tag)
name: AppImage

on:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths-ignore:
      - "README.md"
      - "images/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build AppImage (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            curl \
            ca-certificates \
            zsync \
            libpulse-dev \
            libudev-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libxkbcommon-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libwayland-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve release metadata
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            CHANNEL="latest"
            TAG="${GITHUB_REF_NAME}"
            PRERELEASE="false"
            MAKE_LATEST="true"
            RELEASE_NAME="${GITHUB_REF_NAME}"
          else
            # Rolling build for master / manual runs — Gear Lever channel "continuous"
            # Also mark as GitHub "Latest" so the Releases page shows this build, not an old tag.
            VERSION="continuous"
            CHANNEL="continuous"
            TAG="continuous"
            PRERELEASE="false"
            MAKE_LATEST="true"
            RELEASE_NAME="Continuous build"
          fi
          {
            echo "version=${VERSION}"
            echo "channel=${CHANNEL}"
            echo "tag=${TAG}"
            echo "prerelease=${PRERELEASE}"
            echo "make_latest=${MAKE_LATEST}"
            echo "release_name=${RELEASE_NAME}"
          } >> "$GITHUB_OUTPUT"
          echo "version=${VERSION} channel=${CHANNEL} tag=${TAG}"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build AppImage
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          UPDATE_CHANNEL: ${{ steps.meta.outputs.channel }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x packaging/build-appimage.sh
          ./packaging/build-appimage.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trusdx_driver-${{ steps.meta.outputs.version }}-x86_64
          path: |
            dist/trusdx_driver-x86_64.AppImage
            dist/trusdx_driver-x86_64.AppImage.zsync
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.release_name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
          generate_release_notes: ${{ steps.meta.outputs.channel == 'latest' }}
          body: |
            Automated AppImage build from `${{ github.sha }}` on `${{ github.ref_name }}`.

            Gear Lever / AppImageUpdate channel: `${{ steps.meta.outputs.channel }}`
            Embedded update info uses `gh-releases-zsync` against this release's `.zsync` asset.
          files: |
            dist/trusdx_driver-x86_64.AppImage
            dist/trusdx_driver-x86_64.AppImage.zsync
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
